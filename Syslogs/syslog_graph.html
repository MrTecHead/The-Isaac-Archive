<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Raspberry Pi Syslog Graphs (SVG Version)</title>
<style>
    body {
        background: #111;
        color: #eee;
        font-family: sans-serif;
        margin: 20px;
    }
    .container {
        max-width: 1100px;
        margin: auto;
    }
    svg {
        background: #222;
        width: 100%;
        height: 350px;
        border-radius: 8px;
        margin-bottom: 40px;
    }
    text {
        fill: #ccc;
        font-size: 12px;
    }
</style>
</head>
<body>
<div class="container">
    <h1>Raspberry Pi Syslog Graphs</h1>
    <input type="file" id="fileInput" accept=".txt">
    <p id="status"></p>

    <h2>CPU Temperature (°C)</h2>
    <svg id="tempGraph" width="1000" height="350"></svg>

    <h2>CPU Usage (%)</h2>
    <svg id="cpuGraph" width="1000" height="350"></svg>

    <h2>Memory Usage (%)</h2>
    <svg id="memGraph" width="1000" height="350"></svg>
</div>

<script>
document.getElementById("fileInput").addEventListener("change", function(evt) {
    const file = evt.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = function(e) {
        parseSyslog(e.target.result);
    };
    reader.readAsText(file);
});

function parseSyslog(text) {
    const lines = text.split("\n");

    const times = [];
    const temps = [];
    const cpu = [];
    const mem = [];

    lines.forEach(line => {
        line = line.trim();
        if (!line.startsWith("[")) return;

        try {
            const time = line.substring(1, 9);

            const parts = line.split("|");
            const tempPart = parts[0].split("CPU Temp:")[1];
            const cpuPart = parts[1].split("CPU Usage:")[1];
            const memPart = parts[2].split("Memory Used:")[1];

            times.push(time);
            temps.push(parseFloat(tempPart));
            cpu.push(parseFloat(cpuPart));
            mem.push(parseFloat(memPart));
        } catch {}
    });

    if (times.length < 2) {
        document.getElementById("status").textContent = "Not enough data points parsed.";
        return;
    }

    document.getElementById("status").textContent =
        "Parsed " + times.length + " entries.";

    drawGraph("tempGraph", temps, times, "red");
    drawGraph("cpuGraph", cpu, times, "cyan");
    drawGraph("memGraph", mem, times, "lime");
}

function drawGraph(id, data, labels, color) {
    const svg = document.getElementById(id);
    svg.innerHTML = "";

    const w = parseInt(svg.getAttribute("width"));
    const h = parseInt(svg.getAttribute("height"));

    const paddingLeft = 50;
    const paddingBottom = 30;

    const max = Math.max(...data);
    const min = Math.min(...data);
    const range = max - min || 1; // avoid divide by zero

    // Axes
    const xAxis = document.createElementNS("http://www.w3.org/2000/svg", "line");
    xAxis.setAttribute("x1", paddingLeft);
    xAxis.setAttribute("y1", h - paddingBottom);
    xAxis.setAttribute("x2", w - 10);
    xAxis.setAttribute("y2", h - paddingBottom);
    xAxis.setAttribute("stroke", "#888");
    xAxis.setAttribute("stroke-width", "2");
    svg.appendChild(xAxis);

    const yAxis = document.createElementNS("http://www.w3.org/2000/svg", "line");
    yAxis.setAttribute("x1", paddingLeft);
    yAxis.setAttribute("y1", 10);
    yAxis.setAttribute("x2", paddingLeft);
    yAxis.setAttribute("y2", h - paddingBottom);
    yAxis.setAttribute("stroke", "#888");
    yAxis.setAttribute("stroke-width", "2");
    svg.appendChild(yAxis);

    // Y labels: min, mid, max
    const yLabels = [min, (min + max) / 2, max];
    yLabels.forEach(val => {
        const y = h - paddingBottom - ((val - min) / range) * (h - paddingBottom - 10);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", 10);
        text.setAttribute("y", y + 4);
        text.textContent = val.toFixed(1);
        svg.appendChild(text);
    });

    // X labels: first, middle, last
    const xIndices = [0, Math.floor(labels.length / 2), labels.length - 1];
    xIndices.forEach(idx => {
        const x = paddingLeft + (idx / (labels.length - 1)) * (w - paddingLeft - 10);
        const text = document.createElementNS("http://www.w3.org/2000/svg", "text");
        text.setAttribute("x", x - 15);
        text.setAttribute("y", h - 5);
        text.textContent = labels[idx];
        svg.appendChild(text);
    });

    // Line
    const points = data.map((v, i) => {
        const x = paddingLeft + (i / (data.length - 1)) * (w - paddingLeft - 10);
        const y = h - paddingBottom - ((v - min) / range) * (h - paddingBottom - 10);
        return `${x},${y}`;
    }).join(" ");

    const poly = document.createElementNS("http://www.w3.org/2000/svg", "polyline");
    poly.setAttribute("points", points);
    poly.setAttribute("stroke", color);
    poly.setAttribute("fill", "none");
    poly.setAttribute("stroke-width", "2");
    svg.appendChild(poly);
}
</script>
</body>
</html>
